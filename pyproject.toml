[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DofusPetMerch"
version = "0.1.0"
description = "Lector pasivo (captura + OCR) de precios del mercadillo de Dofus para calcular la rentabilidad de alimentar mascotas"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dofuspetmerch = ["sheets/*.js"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
DofusPetMerch = "dofuspetmerch.__main__:_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
